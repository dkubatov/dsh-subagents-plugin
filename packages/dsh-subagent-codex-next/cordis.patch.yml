# Fork profile layer: registers the Codex provider as a Host row.
#
# DSH 0.2.2-rc.5 moved delegation tools into Agent Presets: the web bundle
# disables Host-root `tool-subagent` rows, so a Host-only tool row would stay
# inert. Mount the delegation tools inside the preset you use (see
# `preset/standard-codex.patch.yml` and the package README).
- insert:
    - id: subagent-codex-next
      name: 'dsh-subagent-codex-next'
